<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F1F1F1" id="theme-color-meta" />
  <title>Cloud Mail</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231890ff'/%3E%3Cpath d='M7 11l9 6 9-6v11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V11z' fill='%23fff'/%3E%3C/svg%3E" type="image/svg+xml" />
  <link rel="manifest" href="/ui/manifest.webmanifest" />
  <link rel="stylesheet" href="/ui/app.css" />
  <link rel="stylesheet" href="/ui/components.css" />
  <script>
    try {
      var ui = JSON.parse(localStorage.getItem('ui') || '{}')
      if (ui.dark) document.documentElement.setAttribute('class', 'dark')
      var isMobile = !window.matchMedia('(pointer: fine) and (hover: hover)').matches
      var m = document.getElementById('theme-color-meta')
      if (m) m.setAttribute('content', ui.dark ? (isMobile ? '#141414' : '#000000') : (isMobile ? '#191A23' : '#F1F1F1'))
    } catch (e) {}
  </script>
</head>
<body>
  <div id="loading-first">
    <div class="loading-icon">
      <div class="loading-image" style="display:flex;align-items:center;justify-content:center;font-size:34px">&#9993;</div>
      <div class="loading-progress" aria-hidden="true"></div>
    </div>
  </div>
  <div id="app"></div>
  <style>
    #loading-first {
      position: fixed; left: 0; top: 0; height: 100%; width: 100%;
      display: flex; justify-content: center; align-items: center;
      z-index: 500; background: var(--el-bg-color);
    }
    .loading-hide { pointer-events: none; opacity: 0; transition: all 200ms; }
    .loading-icon { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; }
    .loading-image { width: 70px; height: 70px; object-fit: contain; }
    .loading-progress { position: relative; width: 64px; height: 4px; overflow: hidden; border-radius: 999px; background: rgba(64, 158, 255, 0.18); }
    .loading-progress::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #409EFF; transform-origin: left center; animation: loading-progress-grow 1.6s linear forwards; }
    @keyframes loading-progress-grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <script type="module" src="/ui/app.js"></script>
</body>
</html>
